name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: textforge-build
          path: |
            **/build/outputs/**/*.aar
            **/build/outputs/**/*.apk
          if-no-files-found: ignore
